name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Isolate Worktrunk configuration
        shell: bash
        run: echo "WORKTRUNK_CONFIG_PATH=$RUNNER_TEMP/worktrunk.toml" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install ShellCheck on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Install ShellCheck on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Install Worktrunk 0.77.0
        shell: bash
        env:
          WORKTRUNK_NO_MODIFY_PATH: '1'
        run: |
          export WORKTRUNK_INSTALL_DIR="$RUNNER_TEMP/worktrunk"
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/max-sixty/worktrunk/releases/download/v0.77.0/worktrunk-installer.sh | sh
          echo "$WORKTRUNK_INSTALL_DIR/bin" >> "$GITHUB_PATH"
          "$WORKTRUNK_INSTALL_DIR/bin/wt" --version

      - name: Configure Git identity
        run: |
          git config --global user.name "Trunk CI"
          git config --global user.email "trunk-ci@example.com"

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

  node-smoke:
    name: Package smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Isolate Worktrunk configuration
        shell: bash
        run: echo "WORKTRUNK_CONFIG_PATH=$RUNNER_TEMP/worktrunk.toml" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Pack and install as an npm consumer
        shell: bash
        run: |
          bun pm pack --ignore-scripts --filename "$RUNNER_TEMP/trunk.tgz"
          mkdir "$RUNNER_TEMP/trunk-smoke"
          npm install --prefix "$RUNNER_TEMP/trunk-smoke" "$RUNNER_TEMP/trunk.tgz"

      - name: Run the installed CLI
        shell: bash
        run: |
          CLI="$RUNNER_TEMP/trunk-smoke/node_modules/.bin/trunk"
          "$CLI" --help
          test "$("$CLI" --version)" = "$(node -p "require('./package.json').version")"
