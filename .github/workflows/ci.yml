name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Isolate Worktrunk configuration
        shell: bash
        run: echo "WORKTRUNK_CONFIG_PATH=$RUNNER_TEMP/worktrunk.toml" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The generated and documented hook bodies are checked with ShellCheck,
      # and the tmux hook, docs browser and package tests drive a real tmux on
      # an isolated socket. They assert the tool exists rather than skipping, so
      # both have to be installed. Nothing else is: Trunk needs no other tool.
      - name: Install ShellCheck and tmux on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck tmux

      - name: Install ShellCheck and tmux on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck tmux

      - name: Install Worktrunk 0.77.0
        shell: bash
        env:
          WORKTRUNK_NO_MODIFY_PATH: '1'
        run: |
          export WORKTRUNK_INSTALL_DIR="$RUNNER_TEMP/worktrunk"
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/max-sixty/worktrunk/releases/download/v0.77.0/worktrunk-installer.sh | sh
          echo "$WORKTRUNK_INSTALL_DIR/bin" >> "$GITHUB_PATH"
          "$WORKTRUNK_INSTALL_DIR/bin/wt" --version

      - name: Configure Git identity
        run: |
          git config --global user.name "Trunk CI"
          git config --global user.email "trunk-ci@example.com"

      # Deliberately before any build: `bun run test` has to work in a clean
      # checkout, where the generated source/version.ts does not exist yet.
      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  node-smoke:
    name: Package smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The smoke script needs the same three tools as the tests, and nothing
      # more: it packs the tarball, installs it as an npm consumer on this Node
      # version, and runs the installed CLI on throwaway repositories.
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Install Worktrunk 0.77.0
        shell: bash
        env:
          WORKTRUNK_NO_MODIFY_PATH: '1'
        run: |
          export WORKTRUNK_INSTALL_DIR="$RUNNER_TEMP/worktrunk"
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/max-sixty/worktrunk/releases/download/v0.77.0/worktrunk-installer.sh | sh
          echo "$WORKTRUNK_INSTALL_DIR/bin" >> "$GITHUB_PATH"
          "$WORKTRUNK_INSTALL_DIR/bin/wt" --version

      - name: Smoke-test the packed CLI
        run: bun run smoke
